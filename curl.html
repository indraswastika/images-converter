<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CURL Online Tool</title>
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/sweetalert2.min.css" rel="stylesheet">

    <style>
        body {
            padding-top: 56px;
        }

        .card {
            background-color: transparent !important;
        }

        .btn {
            border-radius: 0;
        }

        .form-control {
            border-radius: 0;
        }

        .form-select {
            border-radius: 0;
        }
    </style>
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark bg-dark" aria-label="Main navigation">
        <div class="container-fluid">
            <a class="navbar-brand" href="">CURL Online Tool</a>
        </div>
    </nav>

    <main class="container mt-5">
        <div class="row p-3">
            <div class="card my-3 p-4 bg-transparent shadow-sm" style="border-radius: 0;">
                <div class="card-body">
                    <form id="curlForm">
                        <div class="mb-3">
                            <label for="endpoint" class="form-label">Endpoint URL:</label>
                            <input type="text" class="form-control" id="endpoint" name="endpoint" required>
                        </div>
                        <div class="mb-3">
                            <label for="method" class="form-label">HTTP Method:</label>
                            <select class="form-select" id="method" name="method">
                                <option value="GET">GET</option>
                                <option value="POST">POST</option>
                                <option value="PUT">PUT</option>
                                <option value="DELETE">DELETE</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="headers" class="form-label">Headers (JSON format):</label>
                            <textarea class="form-control" id="headers" name="headers" rows="4" placeholder='{"Content-Type": "application/json"}'></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="params" class="form-label">Parameters (JSON format):</label>
                            <textarea class="form-control" id="params" name="params" rows="4" placeholder='{"key": "value"}'></textarea>
                        </div>
                        <div class="d-grid mb-3">
                            <button type="button" class="btn btn-dark" onclick="sendRequest()">
                                <span>Send Request</span>
                            </button>
                        </div>
                    </form>
                    <h5>Response</h5>
                    <pre id="response" class="bg-white p-3"></pre>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/jquery-3.7.1.min.js"></script>
    <script src="assets/js/sweetalert2.all.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>

    <script>
        function sendRequest() {
            const endpoint = document.getElementById('endpoint').value;
            const method = document.getElementById('method').value;
            const headers = JSON.parse(document.getElementById('headers').value || '{}');
            const params = JSON.parse(document.getElementById('params').value || '{}');

            const options = {
                method: method,
                headers: headers,
            };

            if (method !== 'GET') {
                options.body = JSON.stringify(params);
            }

            fetch(endpoint, options)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('response').textContent = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    document.getElementById('response').textContent = 'Error: ' + error;
                });
        }
    </script>

</body>

</html>
