<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PDF Bulk Compressor</title>
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/sweetalert2.min.css" rel="stylesheet">
    <style>
        .preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }
        .preview-box {
            text-align: center;
            max-width: 150px;
        }
        .preview-box .file-info {
            font-size: 0.8em;
            word-wrap: break-word;
        }
        canvas {
            display: none;
        }
        html, body {
            overflow-x: hidden;
        }
        body {
            padding-top: 56px;
        }
        @media (max-width: 991.98px) {
            .offcanvas-collapse {
                position: fixed;
                top: 56px;
                bottom: 0;
                left: 100%;
                width: 100%;
                padding-right: 1rem;
                padding-left: 1rem;
                overflow-y: auto;
                visibility: hidden;
                background-color: #343a40;
                transition: transform .3s ease-in-out, visibility .3s ease-in-out;
            }
            .offcanvas-collapse.open {
                visibility: visible;
                transform: translateX(-100%);
            }
        }
        .nav-scroller {
            position: relative;
            z-index: 2;
            height: 2.75rem;
            overflow-y: hidden;
        }
        .nav-scroller .nav {
            display: flex;
            flex-wrap: nowrap;
            padding-bottom: 1rem;
            margin-top: -1px;
            overflow-x: auto;
            color: rgba(255, 255, 255, .75);
            text-align: center;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }
        .nav-underline .nav-link {
            padding-top: .75rem;
            padding-bottom: .75rem;
            font-size: .875rem;
            color: #6c757d;
        }
        .nav-underline .nav-link:hover {
            color: #007bff;
        }
        .nav-underline .active {
            font-weight: 500;
            color: #343a40;
        }
        .text-white-50 {
            color: rgba(255, 255, 255, .5);
        }
        .card {
            background-color: transparent !important;
        }
        .btn {
            border-radius: 0;
        }
        .form-control {
            border-radius: 0;
        }
        .form-select {
            border-radius: 0;
        }
        #previewContainer {
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark bg-dark" aria-label="Main navigation">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">INDRAGTG</a>
        </div>
    </nav>
    <div class="nav-scroller bg-body shadow-sm">
        <nav class="nav nav-underline" aria-label="Secondary navigation">
            <a class="nav-link" href="index.html">Convert Format</a>
            <a class="nav-link" href="postal-code.html">Database Indonesia</a>
            <a class="nav-link" href="url-opener.html">Open Multiple URL</a>
            <a class="nav-link" href="duplicate-images.html">Duplicate Images</a>
        </nav>
    </div>

    <main class="container mt-5">
        <div class="row p-3">
            <div class="card my-3 p-4 bg-transparent shadow-sm" style="border-radius: 0;">
                <div class="card-body">
                    <div class="mb-3">
                        <label for="fileInput" class="form-label">Upload PDF Files</label>
                        <input type="file" class="form-control" id="fileInput" multiple accept=".pdf">
                    </div>
                    
                    <div class="d-grid mb-3">
                        <button class="btn btn-dark" id="convertBtn">
                            <span id="convertBtnText">Compress All</span>
                        </button>
                    </div>
                    <div class="d-grid mb-3">
                        <button class="btn btn-dark" id="aggressiveBtn">
                            <span id="aggressiveBtnText">Aggressive Compress</span>
                        </button>
                    </div>
                    <div class="d-grid mb-3">
                        <button id="downloadAllBtn" class="btn btn-secondary d-none">Download All</button>
                    </div>

                    <div class="progress mb-3 d-none" id="progressWrapper">
                        <div id="progressBar" class="progress-bar bg-dark" role="progressbar" style="width: 0%; border-radius: 0;">0%</div>
                    </div>

                    <div class="row" id="previewContainer"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/jquery-3.7.1.min.js"></script>
    <script src="assets/js/jszip.min.js"></script>
    <script src="assets/js/sweetalert2.all.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    
    <script>
        const fileInput = document.getElementById('fileInput');
        const convertBtn = document.getElementById('convertBtn');
        const aggressiveBtn = document.getElementById('aggressiveBtn');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const previewContainer = document.getElementById('previewContainer');
        const progressWrapper = document.getElementById('progressWrapper');
        const progressBar = document.getElementById('progressBar');

        let compressedFiles = [];

        async function processFiles(files, isAggressive) {
            compressedFiles = [];
            previewContainer.innerHTML = '';
            progressWrapper.classList.remove('d-none');
            progressBar.style.width = '0%';
            progressBar.innerText = '0%';
            downloadAllBtn.classList.add('d-none');

            const zip = new JSZip();

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                try {
                    const originalBytes = await file.arrayBuffer();
                    const pdfDoc = await PDFLib.PDFDocument.load(originalBytes, { ignoreEncryption: true });
                    
                    let compressedBytes;

                    if (isAggressive) {
                        compressedBytes = await pdfDoc.save({ useFlateCompression: true });
                    } else {
                        compressedBytes = await pdfDoc.save();
                    }

                    const originalSize = originalBytes.byteLength;
                    const compressedSize = compressedBytes.length;
                    const compressionRate = Math.round(((originalSize - compressedSize) / originalSize) * 100);

                    const compressedBlob = new Blob([compressedBytes], { type: 'application/pdf' });
                    zip.file(file.name, compressedBlob);

                    const thumb = document.createElement('div');
                    thumb.classList.add('col-md-2', 'mb-3', 'preview-box');

                    const infoElem = document.createElement('div');
                    infoElem.classList.add('file-info');
                    infoElem.innerHTML = `<strong>${file.name}</strong><br>
                                            <span class="text-success">${compressionRate}% Compressed</span><br>
                                            <span class="text-muted">Original: ${(originalSize / 1024 / 1024).toFixed(2)} MB</span><br>
                                            <span class="text-muted">Compressed: ${(compressedSize / 1024 / 1024).toFixed(2)} MB</span>`;

                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = 'btn btn-sm btn-outline-dark mt-2';
                    downloadBtn.textContent = 'Download';
                    downloadBtn.onclick = () => {
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(compressedBlob);
                        link.download = file.name;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    };

                    thumb.appendChild(infoElem);
                    thumb.appendChild(downloadBtn);
                    previewContainer.appendChild(thumb);

                    compressedFiles.push({ name: file.name, blob: compressedBlob });
                    
                    const progress = Math.round(((i + 1) / files.length) * 100);
                    progressBar.style.width = `${progress}%`;
                    progressBar.innerText = `${i + 1}/${files.length}`;

                } catch (e) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Compression Failed',
                        text: `Could not process ${file.name}. It might be a corrupted file or have an unsupported format.`,
                        confirmButtonText: 'OK',
                        customClass: { confirmButton: 'btn btn-dark' },
                        buttonsStyling: false,
                        allowOutsideClick: false
                    });
                    console.error(`Error processing ${file.name}:`, e);
                }
            }

            downloadAllBtn.classList.remove('d-none');
            downloadAllBtn.onclick = () => {
                zip.generateAsync({ type: 'blob' }).then((content) => {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(content);
                    a.download = 'compressed_pdfs.zip';
                    a.click();
                });
            };
        }

        convertBtn.addEventListener('click', () => {
            const files = fileInput.files;
            if (!files.length) {
                 return Swal.fire({
                    icon: 'warning',
                    title: 'No Files Selected',
                    text: 'Please select PDF files first.',
                    confirmButtonText: 'OK',
                    customClass: { confirmButton: 'btn btn-dark' },
                    buttonsStyling: false,
                    allowOutsideClick: false
                });
            }
            processFiles(files, false);
        });

        aggressiveBtn.addEventListener('click', () => {
            const files = fileInput.files;
            if (!files.length) {
                 return Swal.fire({
                    icon: 'warning',
                    title: 'No Files Selected',
                    text: 'Please select PDF files first.',
                    confirmButtonText: 'OK',
                    customClass: { confirmButton: 'btn btn-dark' },
                    buttonsStyling: false,
                    allowOutsideClick: false
                });
            }
            processFiles(files, true);
        });
    </script>
</body>
</html>
