<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Data Partition Sheets</title>
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
	<link href="assets/css/sweetalert2.min.css" rel="stylesheet">

    <style>
        .preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .preview-box {
            text-align: center;
            max-width: 150px;
        }

        .preview-box img {
            max-width: 100%;
            height: auto;
            display: block;
            margin-bottom: 5px;
        }

        canvas {
            display: none;
        }

        html,
        body {
            overflow-x: hidden;
        }

        body {
            padding-top: 56px;
        }

        @media (max-width: 991.98px) {
            .offcanvas-collapse {
                position: fixed;
                top: 56px;
                bottom: 0;
                left: 100%;
                width: 100%;
                padding-right: 1rem;
                padding-left: 1rem;
                overflow-y: auto;
                visibility: hidden;
                background-color: #343a40;
                transition: transform .3s ease-in-out, visibility .3s ease-in-out;
            }

            .offcanvas-collapse.open {
                visibility: visible;
                transform: translateX(-100%);
            }
        }

        .nav-scroller {
            position: relative;
            z-index: 2;
            height: 2.75rem;
            overflow-y: hidden;
        }

        .nav-scroller .nav {
            display: flex;
            flex-wrap: nowrap;
            padding-bottom: 1rem;
            margin-top: -1px;
            overflow-x: auto;
            color: rgba(255, 255, 255, .75);
            text-align: center;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        .nav-underline .nav-link {
            padding-top: .75rem;
            padding-bottom: .75rem;
            font-size: .875rem;
            color: #6c757d;
        }

        .nav-underline .nav-link:hover {
            color: #007bff;
        }

        .nav-underline .active {
            font-weight: 500;
            color: #343a40;
        }

        .text-white-50 {
            color: rgba(255, 255, 255, .5);
        }

        .card {
            background-color: transparent !important;
        }

        .btn {
            border-radius: 0;
        }

        .form-control {
            border-radius: 0;
        }

        .form-select {
            border-radius: 0;
        }

		#previewContainer {
		    max-height: 500px;
		    overflow-y: auto;
		}

    </style>
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark bg-dark" aria-label="Main navigation">
        <div class="container-fluid">
            <a class="navbar-brand" href="">INDRAGTG</a>
        </div>
    </nav>

    <div class="nav-scroller bg-body shadow-sm">
        <nav class="nav nav-underline" aria-label="Secondary navigation">
            <a class="nav-link active" aria-current="page" href="index.html">Convert Format</a>
            <a class="nav-link" aria-current="page" href="split.html">Data Partition Sheets</a>
            <a class="nav-link" aria-current="page" href="postal-code.html">Database Indonesia</a>
        </nav>
    </div>

    <main class="container mt-5">
        <div class="row p-3">
            <div class="card my-3 p-4 bg-transparent shadow-sm" style="border-radius: 0;">
                <div class="card-body">
					<form id="splitForm" enctype="multipart/form-data">
					    <div class="mb-3">
					        <label class="form-label">Upload CSV File</label>
					        <input type="file" class="form-control" id="csvFile" name="csvFile" accept=".csv" required>
					    </div>
					    <div class="mb-3">
					        <label class="form-label">Header Row (e.g. 1)</label>
					        <input type="number" class="form-control" id="headerRow" name="headerRow" required>
					    </div>
					    <div class="mb-3">
					        <label class="form-label">Rows per Split</label>
					        <input type="number" class="form-control" id="chunkSize" name="chunkSize" required>
					    </div>
					    <div class="d-grid mb-3">
					        <button class="btn btn-dark" id="splitBtn">
					            <span id="convertBtnText">Split</span>
					        </button>
					    </div>
						<div class="d-grid mb-3">
						    <a id="downloadAllBtn" class="btn btn-secondary d-none" download>Download All</a>
						</div>
					</form>

					<div class="progress mb-3 d-none" id="progressWrapper">
					    <div id="progressBar" class="progress-bar bg-dark" role="progressbar" style="width: 0%; border-radius: 0;">0%</div>
					</div>

					<div id="result" class="alert d-none"></div>
					<div class="row" id="previewContainer"></div>

                </div>
            </div>
        </div>
    </main>
    <canvas id="canvas"></canvas>
    <script src="assets/js/jquery-3.7.1.min.js"></script>
    <script src="assets/js/jszip.min.js"></script>
    <script src="assets/js/sweetalert2.all.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>

	<script>
	$("#splitForm").on("submit", function (e) {
	    e.preventDefault();

	    const formData = new FormData(this);
	    const progressWrapper = $("#progressWrapper");
	    const progressBar = $("#progressBar");
	    const previewContainer = $("#previewContainer");
	    const splitBtn = $("#splitBtn");
	    const convertBtnText = $("#convertBtnText");
	    const downloadAllBtn = $("#downloadAllBtn");

	    previewContainer.empty();
	    downloadAllBtn.addClass("d-none").attr("href", "#");
	    progressBar.css("width", "0%").text("0%");
	    progressWrapper.removeClass("d-none");
	    convertBtnText.text("Processing...");
	    splitBtn.prop("disabled", true);

	    $.ajax({
	        xhr: function () {
	            let xhr = new XMLHttpRequest();
	            xhr.upload.addEventListener("progress", function (e) {
	                if (e.lengthComputable) {
	                    let percent = Math.round((e.loaded / e.total) * 100);
	                    progressBar.css("width", percent + "%").text(percent + "%");
	                }
	            });
	            return xhr;
	        },
	        url: "process.php",
	        type: "POST",
	        data: formData,
	        processData: false,
	        contentType: false,

	        success: function (response) {
	            convertBtnText.text("Split");
	            splitBtn.prop("disabled", false);

	            try {
	                const data = JSON.parse(response);

	                if (data.success) {
	                    Swal.fire({
	                        icon: "success",
	                        title: "Split Successful",
	                        text: "The file has been split successfully.",
	                        timer: 3000,
	                        showConfirmButton: false
	                    });

	                    if (data.download) {
	                        downloadAllBtn
	                            .removeClass("d-none")
	                            .attr("href", data.download);
	                    }


	                } else {
	                    Swal.fire({
	                        icon: "error",
	                        title: "Split Failed",
	                        text: data.message || "An error occurred during the split process.",
	                    });
	                }

	            } catch (e) {
	                Swal.fire({
	                    icon: "error",
	                    title: "Invalid Response",
	                    text: "The server response could not be parsed.",
	                });
	            }
	        },

	        error: function () {
	            convertBtnText.text("Split");
	            splitBtn.prop("disabled", false);
	            Swal.fire({
	                icon: "error",
	                title: "Request Failed",
	                text: "Something went wrong during the request.",
	            });
	        }
	    });
	});
	</script>


</body>

</html>
